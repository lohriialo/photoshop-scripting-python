name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (no platform extras)
        run: pip install -e ".[dev]"

      - name: Compile Python sources
        run: |
          python -m compileall -q photoshop_scripting tools recipes sample_scripts

      - name: Forbid hardcoded legacy paths
        run: |
          if grep -RIn --include='*.py' -E 'C:\\\\Git|C:\\Git' \
              --exclude-dir=.git --exclude-dir=api_reference . ; then
            echo "Hardcoded C:\\Git paths are not allowed. Use photoshop_scripting.paths."
            exit 1
          fi

      - name: Ruff (package, tools, recipes, sample_scripts)
        run: ruff check photoshop_scripting tools recipes sample_scripts
